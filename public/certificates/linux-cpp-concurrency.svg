<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="Linux System Programming and C++ Concurrency Certificate">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080d1a"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#091b29"/>
    </linearGradient>
    <linearGradient id="cardGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#0f172a" stop-opacity="0.95"/>
    </linearGradient>
    <linearGradient id="cppGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#f97316"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="1280" height="720" fill="url(#bgGrad3)"/>
  <rect x="40" y="40" width="1200" height="640" rx="24" fill="url(#cardGrad3)" stroke="#1e3a5f" stroke-width="2"/>
  <rect x="52" y="52" width="1176" height="616" rx="18" fill="none" stroke="#38bdf8" stroke-opacity="0.25" stroke-dasharray="8 8"/>

  <!-- Left: C++ Logo + Concurrency Thread Diagram Badge -->
  <g transform="translate(100, 140)">
    <rect width="360" height="440" rx="20" fill="#070c18" stroke="#0284c7" stroke-width="2"/>
    
    <!-- Linux Terminal Title Bar -->
    <rect x="0" y="0" width="360" height="42" rx="20" fill="#0f172a"/>
    <circle cx="30" cy="21" r="6" fill="#ef4444"/>
    <circle cx="50" cy="21" r="6" fill="#f59e0b"/>
    <circle cx="70" cy="21" r="6" fill="#10b981"/>
    <text x="180" y="26" fill="#94a3b8" font-family="monospace" font-size="13" text-anchor="middle">terminal: bash - POSIX threads</text>

    <!-- C++ Hex Shield -->
    <g transform="translate(145, 65)">
      <polygon points="35,0 70,20 70,60 35,80 0,60 0,20" fill="#00599c" stroke="#38bdf8" stroke-width="2"/>
      <text x="35" y="48" fill="#ffffff" font-family="system-ui, sans-serif" font-size="24" font-weight="900" text-anchor="middle">C++</text>
    </g>

    <!-- Multithreading Concurrency Timeline -->
    <g transform="translate(25, 175)">
      <!-- Thread 1 -->
      <text x="0" y="20" fill="#38bdf8" font-family="monospace" font-size="12">T1 [Ingest]  ────[======]───┬─────────▶</text>
      <!-- Thread 2 -->
      <text x="0" y="60" fill="#f97316" font-family="monospace" font-size="12">T2 [Compute] ──────┬──[======]────────▶</text>
      <!-- Thread 3 -->
      <text x="0" y="100" fill="#22c55e" font-family="monospace" font-size="12">T3 [Writer]  ──────────────[======]───▶</text>

      <!-- Mutex Lock Synchronization Points -->
      <rect x="185" y="6" width="70" height="20" rx="4" fill="#0284c7" fill-opacity="0.4" stroke="#38bdf8"/>
      <text x="220" y="20" fill="#e0f2fe" font-family="monospace" font-size="10" text-anchor="middle">std::mutex</text>

      <rect x="160" y="46" width="75" height="20" rx="4" fill="#c2410c" fill-opacity="0.4" stroke="#f97316"/>
      <text x="197" y="60" fill="#ffedd5" font-family="monospace" font-size="10" text-anchor="middle">lock_guard</text>
    </g>

    <!-- Console Output Simulation -->
    <rect x="25" y="310" width="310" height="100" rx="10" fill="#020617" stroke="#1e293b"/>
    <text x="40" y="335" fill="#22c55e" font-family="monospace" font-size="12">aryan@sys:~$ ./engine --threads=8</text>
    <text x="40" y="360" fill="#94a3b8" font-family="monospace" font-size="11">[OK] Thread pool initialized (8)</text>
    <text x="40" y="385" fill="#38bdf8" font-family="monospace" font-size="11">[OK] Zero data race concurrency</text>
  </g>

  <!-- Right: Certificate Typography & Details -->
  <g transform="translate(510, 140)">
    <!-- Top Credential Pill -->
    <rect x="0" y="0" width="300" height="34" rx="17" fill="#0c4a6e" stroke="#0284c7" stroke-width="1.5"/>
    <text x="150" y="22" fill="#bae6fd" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" text-anchor="middle" letter-spacing="2">SYSTEMS CERTIFICATION</text>

    <!-- Main Title -->
    <text x="0" y="85" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="38" font-weight="800">Linux System Programming</text>
    <text x="0" y="132" fill="url(#cppGlow)" font-family="system-ui, -apple-system, sans-serif" font-size="36" font-weight="800">&amp; C++ Concurrency</text>
    
    <!-- Subtitle -->
    <text x="0" y="180" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20">Multithreading, POSIX System Calls &amp; Low-Latency Architecture</text>

    <!-- Issuer Section -->
    <line x1="0" y1="215" x2="670" y2="215" stroke="#334155" stroke-width="1.5"/>
    <text x="0" y="255" fill="#64748b" font-family="system-ui, -apple-system, sans-serif" font-size="14" font-weight="600" letter-spacing="1">ISSUED BY</text>
    <text x="0" y="285" fill="#e2e8f0" font-family="system-ui, -apple-system, sans-serif" font-size="22" font-weight="700">Active Learning</text>

    <!-- Skill Chips -->
    <g transform="translate(0, 325)">
      <rect x="0" y="0" width="85" height="32" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="42" y="20" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">C++11/20</text>

      <rect x="97" y="0" width="105" height="32" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="149" y="20" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">std::thread</text>

      <rect x="214" y="0" width="135" height="32" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="281" y="20" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Mutex &amp; Atomics</text>

      <rect x="361" y="0" width="105" height="32" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="413" y="20" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">POSIX IPC</text>

      <rect x="478" y="0" width="115" height="32" rx="8" fill="#0f172a" stroke="#1e293b"/>
      <text x="535" y="20" fill="#38bdf8" font-family="system-ui, sans-serif" font-size="13" font-weight="600" text-anchor="middle">Linux Kernel</text>
    </g>

    <!-- Issue Date & Verification -->
    <text x="0" y="415" fill="#38bdf8" font-family="system-ui, -apple-system, sans-serif" font-size="15" font-weight="600">✓ Verified Credential • Issued May 21, 2026</text>
  </g>
</svg>
